steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/souled-sf-mcp:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/souled-sf-mcp:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/souled-sf-mcp, --all-tags]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - souled-sf-mcp
      - --image=gcr.io/$PROJECT_ID/souled-sf-mcp:$COMMIT_SHA
      - --region=us-east1
      - --platform=managed
      - --min-instances=1
      - --max-instances=2
      - --memory=256Mi
      - --cpu=1
      - --port=8080
      - --allow-unauthenticated
      - --update-secrets=SF_PRIVATE_KEY=sf-private-key:latest,SF_CONSUMER_KEY=sf-consumer-key:latest,SF_USERNAME=sf-username:latest,MCP_BEARER_TOKEN=mcp-bearer-token:latest

images:
  - gcr.io/$PROJECT_ID/souled-sf-mcp
